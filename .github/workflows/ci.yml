name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Engine check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check.sh
        run: bash scripts/check.sh

  check-windows:
    name: Engine check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check.ps1 -Root .

      - name: Shell syntax (Git Bash)
        shell: bash
        run: bash scripts/check.sh

  install-dry-run:
    name: Install dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Simulate local install
        run: |
          mkdir target && cd target
          SRC="${{ github.workspace }}/source"
          mkdir -p home
          HOME="$PWD/home" bash "$SRC/install.sh" --local "$SRC/plugin"

      - name: Verify installed files
        run: |
          cd target
          errors=0

          # VERSION must exist and match source
          if [[ -f engine/VERSION ]]; then
            installed="$(tr -d '[:space:]' < engine/VERSION)"
            src_ver="$(tr -d '[:space:]' < "${{ github.workspace }}/source/VERSION")"
            if [[ "$installed" = "$src_ver" ]]; then
              echo "PASS VERSION matches ($installed)"
            else
              echo "FAIL VERSION mismatch: installed=$installed source=$src_ver"
              errors=$((errors + 1))
            fi
          else
            echo "FAIL engine/VERSION missing after install"
            errors=$((errors + 1))
          fi

          # CLI shim must be executable
          if [[ -x engine/bin/engine ]]; then
            echo "PASS engine CLI executable"
          else
            echo "FAIL engine CLI not executable"
            errors=$((errors + 1))
          fi

          # Spot-check critical files are non-empty
          for f in .claude/commands/engine-init.md engine/scripts/engine-doctor.sh engine/scripts/engine-hook-session-start.sh runtime-law.md; do
            if [[ -s "$f" ]]; then
              echo "PASS $f non-empty"
            else
              echo "FAIL $f missing or empty"
              errors=$((errors + 1))
            fi
          done

          # manifest.json vs actual plugin/ file coverage
          missing=0
          while IFS= read -r src; do
            plugin_file="${{ github.workspace }}/source/plugin/$src"
            if [[ ! -f "$plugin_file" ]]; then
              echo "FAIL manifest entry missing in plugin/: $src"
              missing=$((missing + 1))
            fi
          done < <(python3 -c "
          import json
          with open('${{ github.workspace }}/source/plugin/manifest.json') as f:
              data = json.load(f)
              for entry in data['files']:
                  print(entry['src'])
          " 2>/dev/null || true)
          if [[ "$missing" -gt 0 ]]; then
            errors=$((errors + missing))
          else
            echo "PASS all manifest entries exist in plugin/"
          fi

          [[ "$errors" -eq 0 ]] || exit 1

      - name: Test migrate (install → migrate → verify → idempotency)
        run: |
          cd target
          errors=0

          # Simulate a project that was /engine-init'd (has ENGINE_MAP but no v6 layer)
          echo "# ENGINE_MAP — CI sandbox" > engine/ENGINE_MAP.md

          echo "--- 1. Run engine migrate (first time) ---"
          bash engine/bin/engine migrate 2>&1
          if [[ $? -eq 0 ]]; then
            echo "PASS migrate exit 0"
          else
            echo "FAIL migrate unexpected exit"
            errors=$((errors + 1))
          fi

          echo ""
          echo "--- 2. Verify v6 data-layer structure ---"
          for dir in tasks decisions domains changes evidence plans workstreams .cache; do
            if [[ -d "engine/$dir" ]]; then
              echo "PASS engine/$dir/"
            else
              echo "FAIL engine/$dir/ missing"
              errors=$((errors + 1))
            fi
          done
          for f in engine/domains/federation.json engine/decisions/rules.json AGENTS.md engine/SYSTEM.md; do
            if [[ -f "$f" ]]; then
              echo "PASS $f exists"
            else
              echo "FAIL $f missing"
              errors=$((errors + 1))
            fi
          done

          # rules.json must contain protected_paths
          if grep -q '"protected_paths"' engine/decisions/rules.json; then
            echo "PASS rules.json has protected_paths"
          else
            echo "FAIL rules.json missing protected_paths"
            errors=$((errors + 1))
          fi

          echo ""
          echo "--- 3. Run engine migrate again (idempotency) ---"
          OUT2=$(bash engine/bin/engine migrate 2>&1)
          rc2=$?
          if [[ "$rc2" -eq 0 ]]; then
            echo "PASS migrate idempotent (exit 0)"
          else
            echo "FAIL migrate idempotent (exit $rc2)"
            errors=$((errors + 1))
          fi
          if echo "$OUT2" | grep -q "already current"; then
            echo "PASS migrate reports 'already current'"
          else
            echo "FAIL migrate should report 'already current'"
            errors=$((errors + 1))
          fi

          echo ""
          echo "--- 4. Verify bootloader line budget ---"
          actions_lines=$(wc -l < AGENTS.md)
          if [[ "$actions_lines" -le 45 ]]; then
            echo "PASS AGENTS.md $actions_lines lines <= 45"
          else
            echo "FAIL AGENTS.md $actions_lines lines > 45"
            errors=$((errors + 1))
          fi

          echo ""
          echo "--- 5. Run engine doctor ---"
          bash engine/scripts/engine-doctor.sh . 2>&1 | tail -3
          if [[ ${PIPESTATUS[0]} -eq 0 ]]; then
            echo "PASS engine doctor exit 0"
          else
            echo "WARN engine doctor reported issues"
          fi

          echo ""
          [[ "$errors" -eq 0 ]] || exit 1
          echo "All migrate checks PASSED"
