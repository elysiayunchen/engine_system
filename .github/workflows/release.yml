name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from capsules
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE="release-notes.md"

          # Find previous tag for incremental notes
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"

          {
            printf '## Engine System %s\n\n' "$TAG"

            if [[ -n "$PREV_TAG" ]]; then
              CAPSULES="$(git diff --name-only "$PREV_TAG" HEAD -- 'engine/changes/CHANGE-*.md' 2>/dev/null | sort)"
              printf '> Changes since %s\n\n' "$PREV_TAG"
            else
              CAPSULES="$(ls engine/changes/CHANGE-*.md 2>/dev/null | sort)"
              printf '> Initial release\n\n'
            fi

            if [[ -n "$CAPSULES" ]]; then
              while IFS= read -r capsule; do
                [[ -f "$capsule" ]] || continue
                # Extract title from first line: "# CHANGE-date — description"
                title="$(head -1 "$capsule" | sed 's/^# CHANGE-[0-9-]* — *//' 2>/dev/null || true)"
                [[ -z "$title" || "$title" == "# CHANGE-"* ]] && title="$(basename "$capsule" .md)"
                printf '### %s\n\n' "$title"
                # Include capsule body (skip first line + blank line)
                tail -n +3 "$capsule"
                printf '\n---\n\n'
              done <<< "$CAPSULES"
            else
              printf '_No change capsules found for this release._\n'
            fi
          } > "$NOTES_FILE"

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "--- Generated release notes ---"
          cat "$NOTES_FILE"

      - name: Verify release health
        run: bash scripts/check.sh

      - name: Verify migrate E2E
        run: |
          set -euo pipefail
          SANDBOX=$(mktemp -d)

          # 1. Simulate install from plugin/
          sed \
            -e "s|^BASE_URL=.*|BASE_URL=\"file://$PWD/plugin\"|" \
            -e 's|curl -sSL "\$url" -o "\$dest"|cp "$url" "$dest"|' \
            -e 's|wget -qO "\$dest" "\$url"|cp "$url" "$dest"|' \
            -e "s|https://raw.githubusercontent.com/\${REPO}/\${BRANCH}/runtime-law.md|file://${PWD}/runtime-law.md|" \
            install.sh > "$SANDBOX/install-local.sh"
          (cd "$SANDBOX" && bash install-local.sh)
          echo "PASS install completed"

          # 2. Simulate initialized project + run migrate
          echo "# ENGINE_MAP — release E2E" > "$SANDBOX/engine/ENGINE_MAP.md"
          bash "$SANDBOX/engine/bin/engine" migrate 2>&1
          echo "PASS migrate (first run)"

          # 3. Verify v6 structure
          errors=0
          for dir in tasks decisions domains changes evidence .cache; do
            [[ -d "$SANDBOX/engine/$dir" ]] || { echo "FAIL $dir/ missing"; errors=$((errors + 1)); }
          done
          for f in federation.json rules.json AGENTS.md SYSTEM.md; do
            case "$f" in
              federation.json) [[ -f "$SANDBOX/engine/domains/$f" ]] || { echo "FAIL $f missing"; errors=$((errors + 1)); } ;;
              rules.json)      [[ -f "$SANDBOX/engine/decisions/$f" ]] || { echo "FAIL $f missing"; errors=$((errors + 1)); } ;;
              AGENTS.md)       [[ -f "$SANDBOX/$f" ]] || { echo "FAIL $f missing"; errors=$((errors + 1)); } ;;
              SYSTEM.md)       [[ -f "$SANDBOX/engine/$f" ]] || { echo "FAIL $f missing"; errors=$((errors + 1)); } ;;
            esac
          done

          # 4. Idempotent re-run
          bash "$SANDBOX/engine/bin/engine" migrate 2>&1 | grep -q "already current" \
            && echo "PASS migrate idempotent" \
            || { echo "FAIL migrate should be idempotent"; errors=$((errors + 1)); }

          # 5. Doctor
          bash "$SANDBOX/engine/scripts/engine-doctor.sh" "$SANDBOX" 2>&1 | head -1

          rm -rf "$SANDBOX"
          [[ "$errors" -eq 0 ]] || { echo "Migrate E2E failed ($errors errors)"; exit 1; }
          echo "PASS release migrate E2E"

      - name: Package plugin/
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # tarball (preserves symlinks and permissions)
          tar czf "engine-system-v${VERSION}.tar.gz" -C plugin .

          # zip (for Windows users)
          cd plugin && zip -qr "../engine-system-v${VERSION}.zip" . && cd ..

          # offline install package (plugin/ + install scripts, no network needed)
          OFFLINE_DIR="$(mktemp -d)"
          cp -r plugin/* "$OFFLINE_DIR/"
          cp install.sh install.ps1 "$OFFLINE_DIR/"
          tar czf "engine-system-v${VERSION}-offline.tar.gz" -C "$OFFLINE_DIR" .
          rm -rf "$OFFLINE_DIR"

          echo "Packaged:"
          ls -lh engine-system-v${VERSION}.tar.gz engine-system-v${VERSION}.zip engine-system-v${VERSION}-offline.tar.gz

      - name: Generate checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum \
            "engine-system-v${VERSION}.tar.gz" \
            "engine-system-v${VERSION}.zip" \
            "engine-system-v${VERSION}-offline.tar.gz" \
            > "engine-system-v${VERSION}-checksums.txt"
          echo "--- Checksums ---"
          cat "engine-system-v${VERSION}-checksums.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="${{ steps.notes.outputs.notes_file }}"

          # Pre-release if version contains alpha/beta/rc
          PRERELEASE=""
          if echo "$VERSION" | grep -qiE 'alpha|beta|rc'; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Engine System $TAG" \
            --notes-file "$NOTES" \
            $PRERELEASE \
            "engine-system-v${VERSION}.tar.gz" \
            "engine-system-v${VERSION}.zip" \
            "engine-system-v${VERSION}-offline.tar.gz" \
            "engine-system-v${VERSION}-checksums.txt"

          echo "Release $TAG created successfully."
